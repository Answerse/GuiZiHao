    - generic [ref=e52]:
      - heading "企业介绍" [level=2] [ref=e53]
      - paragraph [ref=e54]: 南山白毛茶系明朝建文帝卓锡在横县南山应天寿佛寺手植，亦称"圣种"白毛茶。1810年列为全国24个名茶之一，1915年巴拿马万国博览会获二等银奖，2008年列入南宁市非物质文化遗产名录，2013年获国家农产品地理标志保护登记，2015年获有机产品认证，2018年通过国家生态原产地保护产品认证。
    - generic [ref=e56]:
      - heading "品牌背景" [level=2] [ref=e57]
      - paragraph [ref=e58]: 广西南山白毛茶茶业有限公司成立于2006年，位于广西横州市那阳镇南山宝华村，是一家专业从事'南山白毛茶'繁育、种植、加工、销售、科研、茶文化传播及茶山生态旅游于一体的综合性企业。南山白毛茶历史悠久，据《中国茶经》记载，明朝建文帝卓锡下江南避难时携白毛茶七株种于横县南山应天寺，故名'圣种'，传种至今六百余年。清嘉庆十五年（1810年）列为全国24种名茶之一；清道光二年（1822年）于巴拿马国际农产品展览会上获银质奖，是中国茶叶在国际博览会上最早获奖的名茶。公司注册'圣种'商标，拥有南山白毛茶和广西六堡茶四金钱冷发酵工艺两项非物质文化遗产制作技艺，被认定为广西农业产业化重点龙头企业和国家级高新技术企业。
    - generic [ref=e60]:
      - heading "核心产品" [level=2] [ref=e61]
      - paragraph [ref=e62]: 公司开发有'圣种'牌南山白毛茶（绿茶）、圣种红茶、圣种岩茶、圣种六堡茶和圣种茉莉毛尖茶四大类数十个产品。南山白毛茶绿茶'色味胜龙井'、伴有荷花香；南山红茶'品胜武夷'，以南山白毛茶茶树鲜叶为原料研发，填补了广西本地茶树品种不能制作岩茶（乌龙茶）的空白；南山六堡茶具有'红、浓、陈、醇'四绝特色。
    - generic [ref=e64]:
      - heading "生产规模" [level=2] [ref=e65]
      - paragraph [ref=e66]: 公司自有茶园基地2200亩以上，其中276亩已通过有机茶认证，年产优质茶叶520吨以上。采用'公司＋专业合作社＋农户'的运作模式，辐射带动横县那阳、校椅等乡镇发展南山白毛茶种植基地近6000亩，直接带动1550户农户。
    - generic [ref=e68]:
      - heading "质量认证" [level=2] [ref=e69]
      - paragraph [ref=e70]: 生产基地自2007年起持续获得中国农业部质量认证中心有机茶认证；公司产品获国家地理标志保护产品认证；通过有机茶标准化栽培关键技术研究与示范项目省级审评，获国内先进科技成果。
    - generic [ref=e72]:
      - heading "荣誉资质" [level=2] [ref=e73]
      - paragraph [ref=e74]: 南山白毛茶于1822年和1915年两次荣获巴拿马国际博览会银质奖，1945年在新加坡国际茶叶展览会获金质奖；公司被评为南宁市农业产业化重点龙头企业、广西农业产业化重点龙头企业、国家级高新技术企业；'圣种'牌南山红茶2007年、2008年荣膺中国东盟博览会唯一指定红茶和国宾礼用茶；获评全国休闲农业与乡村旅游四星级示范企业；入选央视《中国制造2025》百强之列；南山白毛茶制作技艺被列为广西壮族自治区非物质文化遗产。
